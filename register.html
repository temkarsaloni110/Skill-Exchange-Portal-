{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="form-container"><h1>Create Account</h1><p class="muted">Join the skill-sharing community.</p>
<form method="POST">
  <label>Full name</label><input type="text" name="name" placeholder="Your full name" required>
  <label>Email</label><input type="email" name="email" placeholder="you@example.com" required>
  <label>Password</label><input type="password" name="password" placeholder="At least 6 characters" minlength="6" required>
  <button type="submit">Register</button>
</form><p>Already have an account? <a href="/login">Login</a></p></div>{% endblock %}
